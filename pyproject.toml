[project]
name = "skynetworth"
version = "1.0.1"
description = "Calculate a SkyBlock player's networth."
readme = "README.md"
authors = [
    { name = "plun1331", email = "plun@plunthe.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "nbt>=1.5.1",
    "pydantic>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "sphinx>=9.1.0",
]
